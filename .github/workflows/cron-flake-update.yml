name: "cron-flake-update"

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.0
    - uses: cachix/install-nix-action@v31.10.6
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    # A pull request (not a direct push) lets CI check the update before it lands on main.
    # The PAT is needed so that the pull request triggers the other workflows.
    - uses: DeterminateSystems/update-flake-lock@v29
      with:
        token: ${{ secrets.PAT }}
        commit-msg: "chore: nix flake update"
        pr-title: "chore: nix flake update"
        branch: "update-flake-lock"
