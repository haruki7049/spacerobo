name: Rust

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  ci-on-Unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Branches and PRs restore the cache saved on main but do not save their own,
          # so they cannot evict it from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run cargo-xtask
        run: nix develop --print-build-logs --command sh -c 'cargo xtask --debug --release'

  ci-on-Windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Without arguments, rustup installs the toolchain described by rust-toolchain.toml.
      - name: Setup rustup
        run: rustup toolchain install

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Branches and PRs restore the cache saved on main but do not save their own,
          # so they cannot evict it from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run cargo-xtask
        run: cargo xtask --debug --release
