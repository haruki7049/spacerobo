name: Rust

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  ci-on-Unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Branches and PRs restore the cache saved on main but do not save their own,
          # so they cannot evict it from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run cargo-xtask
        run: nix develop --print-build-logs --command sh -c 'cargo xtask --debug --release'

  ci-on-Windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup rustup
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # On master (default branch)
        with:
          toolchain: 1.94.1
          components: clippy, rust-analyzer, rust-src

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Branches and PRs restore the cache saved on main but do not save their own,
          # so they cannot evict it from the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run cargo-xtask
        run: cargo xtask --debug --release
