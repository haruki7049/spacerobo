# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
# Panic on integer overflow instead of wrapping silently, as in the dev profile.
overflow-checks = true

[workspace]
resolver = "3"
default-members = ["crates/client"]
members = [
  # Application crates
  "crates/client",

  # Plugins
  "crates/plugins/shooting_range_plugin",
  "crates/plugins/title_plugin",

  # Library crates
  "crates/commons",
  "crates/player",
  "crates/gun",
  "crates/target",

  # Shared math
  "crates/math",

  # HUD
  "crates/hud",

  # Configuration
  "crates/configs",

  # cargo-xtask
  "crates/xtask",
]

[workspace.package]
authors = ["haruki7049 <tontonkirikiri@gmail.com>"]
version = "0.2.1"
description = "A game to simulate a robo's moving in space"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/haruki7049/spacerobo"
publish = false

[workspace.metadata.crane]
name = "spacerobo"

[workspace.dependencies]
spacerobo_commons.path = "crates/commons"
spacerobo_gun.path = "crates/gun"
spacerobo_player.path = "crates/player"
spacerobo_target.path = "crates/target"
spacerobo_math.path = "crates/math"
spacerobo_hud.path = "crates/hud"
spacerobo_configs.path = "crates/configs"
spacerobo_title_plugin.path = "crates/plugins/title_plugin"
spacerobo_shooting_range_plugin.path = "crates/plugins/shooting_range_plugin"
bevy_math = "0.18.1"
bevy_ecs = "0.18.1"
bevy_input = "0.18.1"
bevy = { version = "0.18.1", features = [
  "debug",
  "serialize",
  "track_location",
  "wayland",
] }
avian3d = { version = "0.6.1", features = ["serialize"] }
serde = { version = "1.0.219", features = ["derive"] }
clap = { version = "4.5.40", features = ["derive", "string"] }
confy = "2.0.0"
toml = "1.1.3"
directories = "6.0.0"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Each member opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
# Integer overflow wraps silently in release builds without `overflow-checks`.
# Use `checked_*`, `saturating_*` or `wrapping_*` instead of raw operators.
# Vector types are allowed in `clippy.toml`.
arithmetic_side_effects = "deny"
